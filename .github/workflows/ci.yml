  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_NAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_NAME }}/hw_35:${{ github.sha }} -t ${{ secrets.DOCKER_HUB_NAME }}/hw_35:latest .

      - name: Push Docker image to Docker Hub
        run: docker push --all-tags ${{ secrets.DOCKER_HUB_NAME }}/hw_35

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: admin-vm1
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Создаем .env файл с ВСЕМИ переменными
            cat << 'EOF' > /home/admin-vm1/.env
            # Django
            SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=${{ secrets.SERVER_IP }},localhost

            # База данных (для Django settings.py)
            NAME=${{ secrets.DB_NAME }}
            USER=${{ secrets.DB_USER }}
            PASSWORD=${{ secrets.DB_PASSWORD }}
            HOST=db
            PORT=5432

            # Для PostgreSQL (он ожидает POSTGRES_*)
            POSTGRES_DB=${{ secrets.DB_NAME }}
            POSTGRES_USER=${{ secrets.DB_USER }}
            POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}

            # Redis
            REDIS_HOST=redis
            REDIS_PORT=6379

            # Celery
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0

            # Docker Hub
            DOCKER_HUB_NAME=${{ secrets.DOCKER_HUB_NAME }}
            TAG=latest
            EOF

            # 2. Создаем директорию и переходим в нее
            mkdir -p /home/admin-vm1/app
            cd /home/admin-vm1/app

            # 3. Создаем docker-compose.yml (без дублирования)
            cat << 'EOF' > docker-compose.yml
            version: '3.8'

            services:
              db:
                image: postgres:16
                container_name: postgres-db
                restart: unless-stopped
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                env_file:
                  - /home/admin-vm1/.env
                networks:
                  - app-network
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              redis:
                image: redis:7-alpine
                container_name: redis-cache
                restart: unless-stopped
                volumes:
                  - redis_data:/data
                networks:
                  - app-network
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              web:
                image: ${DOCKER_HUB_NAME}/hw_35:${TAG:-latest}
                container_name: myapp-container
                restart: unless-stopped
                ports:
                  - "8000:8000"
                env_file:
                  - /home/admin-vm1/.env
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                networks:
                  - app-network
                command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3

              celery:
                image: ${DOCKER_HUB_NAME}/hw_35:${TAG:-latest}
                container_name: celery-worker
                restart: unless-stopped
                command: celery -A config worker --loglevel=info -P eventlet
                env_file:
                  - /home/admin-vm1/.env
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                networks:
                  - app-network

              celery-beat:
                image: ${DOCKER_HUB_NAME}/hw_35:${TAG:-latest}
                container_name: celery-beat
                restart: unless-stopped
                command: celery -A config beat --scheduler django --loglevel=info
                env_file:
                  - /home/admin-vm1/.env
                depends_on:
                  - db
                  - redis
                  - celery
                networks:
                  - app-network

            volumes:
              postgres_data:
              redis_data:

            networks:
              app-network:
                driver: bridge
            EOF

            # 4. Логин в Docker Hub
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKER_HUB_NAME }}" --password-stdin

            # 5. Останавливаем старые контейнеры
            docker-compose down || true

            # 6. Запускаем все контейнеры
            docker-compose up -d

            # 7. Ждем запуска
            sleep 10

            # 8. Проверяем статус
            docker-compose ps

            # 9. Проверяем логи
            docker-compose logs web --tail 20

            # 10. Очистка
            docker image prune -f