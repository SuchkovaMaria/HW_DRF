name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.2.1

      - name: Install flake8
        run: poetry add flake8

      - name: Run flake8
        run: poetry run flake8 .
