services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./.env
    environment:
      HOST: db
      PORT: 5432
      NAME: ${NAME}
      USER: ${USER}
      PASSWORD: ${PASSWORD}
    networks:
      - foo

  db:
    image: postgres:16
    container_name: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    networks:
      - foo

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    env_file:
      - ./.env
    ports:
      - "6379:6379"
    networks:
      - foo

  celery:
    build: .
    command: celery -A config worker --loglevel=info -P eventlet
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
      - redis
    env_file:
      - ./.env
    networks:
      - foo
    restart: always

  celery-beat:
    build: .
    command: celery -A config beat --scheduler django --loglevel=info
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
      - redis
      - celery
    env_file:
      - ./.env
    networks:
      - foo
    restart: always

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web
    networks:
      - foo

volumes:
  postgres_data:
  redis_data:

networks:
  foo:
    driver: bridge